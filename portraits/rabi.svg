<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecc093"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="230" r="210" fill="url(#glow)"/>

  <!-- Soundwave / Broadcast Rings -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="220" r="190" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Character Silhouette & Body (Navy Suit) -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Suit -->
    <path d="M120 460 C120 370 170 330 210 320 L256 370 L302 320 C342 330 392 370 392 460 Z" fill="url(#suitGrad)"/>
    
    <!-- White Shirt Collar -->
    <polygon points="230,320 256,365 240,320" fill="#ffffff"/>
    <polygon points="282,320 256,365 272,320" fill="#ffffff"/>
    
    <!-- Royal Blue Tie -->
    <polygon points="250,340 262,340 266,410 256,425 246,410" fill="#2563eb"/>

    <!-- Neck -->
    <rect x="236" y="270" width="40" height="60" fill="url(#skinGrad)" rx="6"/>

    <!-- Head & Face -->
    <ellipse cx="256" cy="215" rx="72" ry="86" fill="url(#skinGrad)"/>

    <!-- Styled Dark Hair -->
    <path d="M182 195 C180 140 215 118 256 118 C297 118 332 140 330 195 C320 160 295 142 256 142 C217 142 192 160 182 195 Z" fill="#18181b"/>
    <path d="M180 180 Q174 210 186 230 Q192 200 188 175 Z" fill="#18181b"/>
    <path d="M332 180 Q338 210 326 230 Q320 200 324 175 Z" fill="#18181b"/>

    <!-- Eyes & Brows -->
    <path d="M210 185 Q225 180 238 186" fill="none" stroke="#18181b" stroke-width="5" stroke-linecap="round"/>
    <path d="M274 186 Q287 180 302 185" fill="none" stroke="#18181b" stroke-width="5" stroke-linecap="round"/>
    
    <ellipse cx="225" cy="198" rx="7" ry="5" fill="#18181b"/>
    <ellipse cx="287" cy="198" rx="7" ry="5" fill="#18181b"/>
    <circle cx="227" cy="196" r="2" fill="#ffffff"/>
    <circle cx="289" cy="196" r="2" fill="#ffffff"/>

    <!-- Nose & Mouth -->
    <path d="M256 200 L251 228 L261 228" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <path d="M242 250 Q256 256 270 250" fill="none" stroke="#991b1b" stroke-width="4" stroke-linecap="round"/>

    <!-- Stubble / Beard Trim -->
    <path d="M220 238 C230 270 282 270 292 238 C280 278 232 278 220 238 Z" fill="#27272a" fill-opacity="0.3"/>
  </g>

  <!-- Golden Bell (Ghanti Emblem) in Corner -->
  <g transform="translate(380, 50)" filter="url(#shadow)">
    <circle cx="45" cy="45" r="42" fill="#1e293b" stroke="url(#bellGrad)" stroke-width="4"/>
    <!-- Bell Shape -->
    <path d="M45 22 C34 22 30 32 28 48 L22 54 L68 54 L62 48 C60 32 56 22 45 22 Z" fill="url(#bellGrad)"/>
    <circle cx="45" cy="58" r="5" fill="#ca8a04"/>
    <circle cx="45" cy="18" r="4" fill="none" stroke="url(#bellGrad)" stroke-width="3"/>
  </g>

  <!-- Character Banner Tag -->
  <g transform="translate(40, 430)">
    <polygon points="0,0 220,0 200,50 0,50" fill="#0f172a" opacity="0.9"/>
    <polygon points="2,2 216,2 198,48 2,48" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="34" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#ffffff" letter-spacing="2">RABI</text>
    <text x="85" y="32" font-family="'Barlow', sans-serif" font-weight="700" font-size="12" fill="#eab308" letter-spacing="1">GHANTI</text>
  </g>
</svg>
